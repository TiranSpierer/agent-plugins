name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            plugins/custom-statusline/src/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('plugins/custom-statusline/src/Cargo.lock') }}

      - name: Run Tests
        run: |
          cd plugins/custom-statusline/src
          cargo test --verbose

      - name: Check Formatting
        run: |
          cd plugins/custom-statusline/src
          cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cd plugins/custom-statusline/src
          cargo clippy -- -D warnings
