name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: statusline.exe
            asset_name: statusline-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: statusline
            asset_name: statusline-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: statusline
            asset_name: statusline-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: statusline
            asset_name: statusline-darwin-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: |
          cd plugins/custom-statusline/src
          cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Copy-Item plugins/custom-statusline/src/target/${{ matrix.target }}/release/${{ matrix.bin_name }} -Destination ${{ matrix.asset_name }}

      - name: Stage Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp plugins/custom-statusline/src/target/${{ matrix.target }}/release/${{ matrix.bin_name }} ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
